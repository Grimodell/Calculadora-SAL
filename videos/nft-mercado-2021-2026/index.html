<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="31"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="f01-titulo"
        class="clip"
        data-composition-id="f01-titulo"
        data-composition-src="compositions/frames/01-titulo.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f02-global"
        class="clip"
        data-composition-id="f02-global"
        data-composition-src="compositions/frames/02-global.html"
        data-start="4"
        data-duration="10"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f03-rubros"
        class="clip"
        data-composition-id="f03-rubros"
        data-composition-src="compositions/frames/03-rubros.html"
        data-start="14"
        data-duration="8"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f04-regiones"
        class="clip"
        data-composition-id="f04-regiones"
        data-composition-src="compositions/frames/04-regiones.html"
        data-start="22"
        data-duration="6"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="f05-cierre"
        class="clip"
        data-composition-id="f05-cierre"
        data-composition-src="compositions/frames/05-cierre.html"
        data-start="28"
        data-duration="3"
        data-track-index="0"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
