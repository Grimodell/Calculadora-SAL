        .source { position: absolute; left: 140px; bottom: 44px; font-size: 20px; color: #6E6E6E; }
        .accent { color: #B84A0E; } .up { color: #1F5FA8; }

        #g2-head { position: absolute; left: 140px; top: 80px; right: 140px; display: flex; flex-direction: column; gap: 14px; }
        #g2-title { font-family: "EB Garamond", serif; font-weight: 400; font-size: 72px; line-height: 1.05; max-width: 1640px; }
        #g2-title b { font-weight: 700; color: #B84A0E; }
        #g2-unit { font-size: 26px; color: #6E6E6E; }

        #g2-chart { position: absolute; left: 140px; right: 140px; bottom: 150px; height: 560px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 2px solid #262626; }
        .g2-col { position: relative; width: 200px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 10px; }
        .g2-val { font-size: 44px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; color: #6E6E6E; }
        .g2-bar { display: block; width: 136px; background: #C8CCD1; }
        .g2-bar.peak { background: #8A9099; }
        .g2-bar.focus { background: #B84A0E; }
        .g2-bar.partial { background: repeating-linear-gradient(135deg, #C8CCD1 0 8px, #FFFFFF 8px 14px); border: 2px solid #C8CCD1; border-bottom: 0; }
        .g2-year { position: absolute; bottom: -46px; font-size: 26px; color: #262626; font-variant-numeric: tabular-nums; }
        .g2-delta { position: absolute; bottom: -80px; font-size: 20px; color: #6E6E6E; font-variant-numeric: tabular-nums; white-space: nowrap; }

        #g2-note { position: absolute; left: 1290px; top: 540px; width: 500px; display: flex; flex-direction: column; gap: 8px; }
        #g2-note-big { font-family: "EB Garamond", serif; font-weight: 700; font-size: 96px; line-height: 1; color: #B84A0E; font-variant-numeric: tabular-nums; }
        #g2-note-text { font-size: 26px; line-height: 1.35; color: #262626; }
      </style>

      <div data-hf-id="hf-hcvr" id="root" data-composition-id="f02-global" data-width="1920" data-height="1080">
        <div data-hf-id="hf-qtgr" id="g2-stage" style="position: absolute; inset: 0">
        <div data-hf-id="hf-ati5" id="g2-head">
          <div data-hf-id="hf-z7hz" class="label">Evolución global</div>
          <h2 data-hf-id="hf-x1xh" id="g2-title">Las ventas de NFT cayeron <b data-hf-id="hf-spud">74 %</b> desde el pico de 2022</h2>
          <div data-hf-id="hf-p18g" id="g2-unit">Volumen anual de ventas, en miles de millones de USD</div>
        </div>

        <div data-hf-id="hf-d5sz" id="g2-note">
          <div data-hf-id="hf-ey3s" id="g2-note-big">−74 %</div>
          <div data-hf-id="hf-yuom" id="g2-note-text">de 21,9 a 5,6 entre 2022 y 2025</div>
        </div>

        <div data-hf-id="hf-z8rp" id="g2-chart">
          <div data-hf-id="hf-3hqe" class="g2-col">
            <div data-hf-id="hf-iz4x" class="g2-val">18,3</div>
            <div data-hf-id="hf-eva3" class="g2-bar" style="height: 368px"></div>
            <div data-hf-id="hf-kgbx" class="g2-year" data-layout-allow-overflow>2021</div>
          </div>
          <div data-hf-id="hf-19xm" class="g2-col">
            <div data-hf-id="hf-jelv" class="g2-val">21,9</div>
            <div data-hf-id="hf-olr9" class="g2-bar peak" style="height: 440px"></div>
            <div data-hf-id="hf-ln90" class="g2-year" data-layout-allow-overflow>2022</div>
            <div data-hf-id="hf-owyn" data-layout-allow-overflow class="g2-delta up">▲ 20 %</div>
          </div>
          <div data-hf-id="hf-1o8n" class="g2-col">
            <div data-hf-id="hf-11dm" class="g2-val">8,7</div>
            <div data-hf-id="hf-qvyr" class="g2-bar" style="height: 175px"></div>
            <div data-hf-id="hf-l8xz" class="g2-year" data-layout-allow-overflow>2023</div>
            <div data-hf-id="hf-8uy8" data-layout-allow-overflow class="g2-delta accent">▼ 60 %</div>
          </div>
          <div data-hf-id="hf-22jo" class="g2-col">
            <div data-hf-id="hf-6lo0" class="g2-val">8,9</div>
            <div data-hf-id="hf-2t5b" class="g2-bar" style="height: 179px"></div>
            <div data-hf-id="hf-mfv2" class="g2-year" data-layout-allow-overflow>2024</div>
            <div data-hf-id="hf-d1ov" data-layout-allow-overflow class="g2-delta up">▲ 2 %</div>
          </div>
          <div data-hf-id="hf-2gup" class="g2-col">
            <div data-hf-id="hf-hhj2" class="g2-val">5,6</div>
            <div data-hf-id="hf-v7or" class="g2-bar focus" style="height: 113px"></div>

            <div data-hf-id="hf-1fng" data-layout-allow-overflow class="g2-delta accent">▼ 37 %</div>
          </div>
          <div data-hf-id="hf-2v5q" class="g2-col">
            <div data-hf-id="hf-i28j" class="g2-val">1,9</div>
            <div data-hf-id="hf-mg9j" class="g2-bar partial" style="height: 39px"></div>
            <div data-hf-id="hf-2p46" class="g2-year" data-layout-allow-overflow>2026*</div>
            <div data-hf-id="hf-k0mr" data-layout-allow-overflow class="g2-delta">parcial</div>

        <div data-hf-id="hf-hzps" class="source">Fuente: CryptoSlam · *2026 hasta el 22 de septiembre</div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const S = (id) => document.getElementById(id);
        const fmt = (v) => v.toFixed(1).replace(".", ",");
        tl.fromTo(S("g2-head"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.2);
        const cols = Array.from(document.querySelectorAll("#g2-chart .g2-col"));
        const targets = [18.3, 21.9, 8.7, 8.9, 5.6, 1.9];
        tl.fromTo(cols.map((c) => c.querySelector(".g2-year")), { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, 0.7);
        cols.forEach((col, i) => {
          const at = 1.1 + i * 0.4;
          const bar = col.querySelector(".g2-bar");
          const val = col.querySelector(".g2-val");
          const delta = col.querySelector(".g2-delta");
          const state = { v: 0 };
          tl.fromTo(bar, { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.out", transformOrigin: "bottom center" }, at);
          tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, at);
          tl.fromTo(state, { v: 0 }, { v: targets[i], duration: 0.8, ease: "power3.out", onUpdate: () => { val.textContent = fmt(state.v); } }, at);
          if (delta) tl.fromTo(delta, { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, at + 0.6);
        });
        // Knaflic: build in gray, then add color where the story is
        tl.fromTo(document.querySelector("#g2-chart .g2-bar.peak"), { backgroundColor: "#C8CCD1" }, { backgroundColor: "#8A9099", duration: 0.6, ease: "power1.inOut" }, 4.6);
        tl.to(cols[1].querySelector(".g2-val"), { color: "#262626", duration: 0.6, ease: "power1.inOut" }, 4.6);
        tl.fromTo(document.querySelector("#g2-chart .g2-bar.focus"), { backgroundColor: "#C8CCD1" }, { backgroundColor: "#B84A0E", duration: 0.6, ease: "power1.inOut" }, 5.2);
        tl.to(cols[4].querySelector(".g2-val"), { color: "#B84A0E", duration: 0.6, ease: "power1.inOut" }, 5.2);
        tl.fromTo(S("g2-note"), { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.7, ease: "power2.out" }, 5.8);
        tl.fromTo(document.querySelector("#g2-stage .source"), { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 6.4);
        tl.to(document.getElementById("g2-stage"), { opacity: 0, duration: 0.35, ease: "power1.in" }, 9.6);
        window.__timelines["f02-global"] = tl;
      </script>
    </template>
