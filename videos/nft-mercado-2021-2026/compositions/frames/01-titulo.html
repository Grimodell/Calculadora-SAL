<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #FFFFFF; color: #262626; font-family: "Inter", sans-serif; overflow: hidden; }
        .label { font-size: 24px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #6E6E6E; }
        .serif { font-family: "EB Garamond", serif; }

        #t1-content { position: absolute; left: 140px; right: 140px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 36px; }
        #t1-title { font-family: "EB Garamond", serif; font-weight: 400; font-size: 176px; line-height: 0.98; letter-spacing: -0.01em; max-width: 1400px; }
        #t1-title em { font-style: italic; color: #B84A0E; }
        #t1-rule { width: 120px; height: 3px; background: #262626; }
        #t1-sub { font-size: 38px; line-height: 1.35; color: #6E6E6E; max-width: 1100px; }
        #t1-sub b { color: #262626; font-weight: 700; }
      </style>

      <div data-hf-id="hf-5c5i" id="root" data-composition-id="f01-titulo" data-width="1920" data-height="1080">
        <div data-hf-id="hf-1iy9" id="t1-stage" style="position: absolute; inset: 0">
        <div data-hf-id="hf-rtmg" id="t1-content">
          <div data-hf-id="hf-b26k" class="label">Mercado NFT · 2021–2026</div>
          <h1 data-hf-id="hf-jrmv" id="t1-title">Del boom <em data-hf-id="hf-o4ra">al ajuste</em></h1>
          <div data-hf-id="hf-dkv7" id="t1-rule"></div>
          <div data-hf-id="hf-k17y" id="t1-sub"><b data-hf-id="hf-l8wt">Cuánto se vendió en NFT cada año</b>, y cómo cambió por rubro y por región.</div>
        </div>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });
        const S = (id) => document.getElementById(id);
        const label = document.querySelector("#t1-content .label");
        tl.fromTo(label, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0.2);
        tl.fromTo(S("t1-title"), { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.4);
        tl.fromTo(S("t1-rule"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut", transformOrigin: "left center" }, 1.1);
        tl.fromTo(S("t1-sub"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 1.4);
        tl.to(document.getElementById("t1-stage"), { opacity: 0, duration: 0.35, ease: "power1.in" }, 3.6);
        window.__timelines["f01-titulo"] = tl;
      </script>
    </template>
  </body>
</html>
