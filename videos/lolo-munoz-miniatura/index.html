<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; background: #F4EFE4; }
      #root { width: 100%; height: 100%; position: relative; background: #F4EFE4; color: #1C1B19; font-family: "Inter", sans-serif; overflow: hidden; }

      #face { position: absolute; inset: 0; width: 1080px; height: 1080px; }
      #name { position: absolute; left: 60px; top: 170px; display: flex; flex-direction: column; }
      #first { font-family: "EB Garamond", serif; font-style: italic; font-weight: 700; font-size: 330px; line-height: 0.82; color: #C8381F; letter-spacing: -0.02em; }
      #last { font-family: "EB Garamond", serif; font-weight: 400; font-size: 200px; line-height: 0.9; letter-spacing: -0.015em; margin-left: 10px; }

      #bottom { position: absolute; left: 72px; right: 72px; bottom: 72px; display: flex; flex-direction: column; gap: 18px; }
      #rule { width: 120px; height: 6px; background: #1C1B19; }
      #reel { font-size: 66px; font-weight: 900; line-height: 0.98; letter-spacing: -0.01em; text-transform: uppercase; }
      #reel .amp { font-family: "EB Garamond", serif; font-style: italic; font-weight: 400; text-transform: none; color: #2443C7; }
      #genre { font-family: "EB Garamond", serif; font-style: italic; font-size: 46px; line-height: 1.1; color: #1C1B19; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1080"
      data-height="1080"
    >
      <div id="art" class="clip" data-start="0" data-duration="1" data-track-index="0" style="position: absolute; inset: 0">
        <svg id="face" viewBox="0 0 1080 1080" aria-hidden="true">
          <defs>
            <radialGradient id="skin" cx="0.36" cy="0.3" r="0.78">
              <stop offset="0" stop-color="#FFE08A" />
              <stop offset="0.55" stop-color="#F2B33D" />
              <stop offset="1" stop-color="#D98A1C" />
            </radialGradient>
            <clipPath id="head"><circle cx="760" cy="380" r="240" /></clipPath>
            <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="28" /></filter>
            <filter id="softer" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="10" /></filter>
          </defs>
          <ellipse cx="780" cy="652" rx="170" ry="16" fill="#1C1B19" fill-opacity="0.16" filter="url(#softer)" />
          <circle cx="760" cy="380" r="240" fill="url(#skin)" />
          <!-- core shadow: the head turns right, so the far side falls into shade -->
          <g clip-path="url(#head)">
            <circle cx="640" cy="300" r="300" fill="none" stroke="#B9700F" stroke-opacity="0.3" stroke-width="140" filter="url(#soft)" />
            <ellipse cx="680" cy="250" rx="70" ry="44" fill="#FFF3C8" fill-opacity="0.45" filter="url(#softer)" />
          </g>
          <g fill="none" stroke="#1C1B19" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 640 168 C 676 120 748 126 736 176 C 728 204 694 196 704 172" />
            <path d="M 742 298 Q 772 282 804 292" />
            <path d="M 858 288 Q 876 278 894 286" />
            <path d="M 744 336 Q 772 312 800 336" />
            <path d="M 860 328 Q 877 310 893 326" />
            <path d="M 842 336 C 852 360 872 382 846 394" />
            <path d="M 936 318 Q 950 410 908 494" stroke-opacity="0.3" stroke-width="4" />
          </g>
          <ellipse cx="765" cy="402" rx="34" ry="17" fill="#E5644A" fill-opacity="0.35" />
          <ellipse cx="895" cy="394" rx="17" ry="13" fill="#E5644A" fill-opacity="0.35" />
          <ellipse cx="836" cy="458" rx="24" ry="32" transform="rotate(-10 836 458)" fill="#C8381F" stroke="#1C1B19" stroke-width="5" />
        </svg>

        <div id="name">
          <div id="first">Loló</div>
          <div id="last">Muñoz</div>
        </div>

        <div id="bottom">
          <div id="rule"></div>
          <div id="reel">Character Voice <span class="amp">&amp;</span> Singing Reel</div>
          <div id="genre">Canciones infantiles y animación · en español</div>
        </div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
