<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pochoclo SVG</title>
  <style>
    :root {
      --bg: #F5ECD7;
      --card: #FFFDF5;
      --border: #1A0D00;
      --accent: #FCA311;
      --accent2: #E76F51;
      --text: #1A0D00;
      --muted: #7A5C3A;
      --tag-bg: #FCA311;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1A0D00;
        --card: #2A1800;
        --border: #FCA311;
        --accent: #FCA311;
        --accent2: #E76F51;
        --text: #FFF7D6;
        --muted: #C49A5A;
        --tag-bg: #3A1F00;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1A0D00;
      --card: #2A1800;
      --border: #FCA311;
      --accent: #FCA311;
      --accent2: #E76F51;
      --text: #FFF7D6;
      --muted: #C49A5A;
      --tag-bg: #3A1F00;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Arial Black', 'Arial Bold', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 32px 16px 16px;
      text-align: center;
      border-bottom: 3px solid var(--border);
      background: var(--card);
    }
    header h1 {
      font-size: clamp(1.4rem, 4vw, 2.4rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      line-height: 1.15;
    }
    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      font-weight: 400;
      color: var(--muted);
      font-family: Arial, sans-serif;
    }

    .phase-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 16px;
      background: var(--card);
      border-bottom: 2px solid var(--border);
    }
    .phase-nav button {
      padding: 6px 14px;
      border: 2.5px solid var(--border);
      border-radius: 999px;
      background: var(--bg);
      color: var(--text);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }
    .phase-nav button:hover,
    .phase-nav button.active {
      background: var(--accent);
      color: #1A0D00;
      border-color: #1A0D00;
    }

    .stage {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 16px;
      min-height: 380px;
    }

    .character-wrap {
      position: relative;
      width: min(280px, 80vw);
    }

    .character-wrap svg {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 6px 18px rgba(26,13,0,0.18));
    }

    /* === ANIMATIONS === */

    /* Fastidio: subtle impatient sway */
    #fase-fastidio { transform-origin: 90px 220px; }
    .anim-fastidio #fase-fastidio {
      animation: sway 1.2s ease-in-out infinite alternate;
    }
    @keyframes sway {
      from { transform: rotate(-3deg) translateX(-4px); }
      to   { transform: rotate(3deg)  translateX(4px); }
    }

    /* Presión: shake/tremble */
    #fase-presion { transform-origin: 90px 200px; }
    .anim-presion #fase-presion {
      animation: shake 0.18s linear infinite;
    }
    @keyframes shake {
      0%   { transform: translate(0,0) rotate(0); }
      25%  { transform: translate(-3px, 1px) rotate(-1.5deg); }
      50%  { transform: translate(3px, -1px) rotate(1.5deg); }
      75%  { transform: translate(-2px, 2px) rotate(-1deg); }
      100% { transform: translate(0,0) rotate(0); }
    }

    /* POP: pop-in scale */
    #fase-pop { transform-origin: 90px 130px; }
    .anim-pop #fase-pop {
      animation: popIn 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards,
                 float 2s ease-in-out 0.5s infinite alternate;
    }
    @keyframes popIn {
      0%   { transform: scale(0.2) rotate(-15deg); opacity: 0; }
      60%  { transform: scale(1.15) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes float {
      from { transform: translateY(0); }
      to   { transform: translateY(-8px); }
    }

    /* Sorpresa: jump + bounce */
    #fase-sorpresa { transform-origin: 90px 200px; }
    .anim-sorpresa #fase-sorpresa {
      animation: jumpBounce 1.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
    }
    @keyframes jumpBounce {
      0%,100% { transform: translateY(0) scaleY(1) scaleX(1); }
      20%     { transform: translateY(-22px) scaleY(1.05) scaleX(0.97); }
      40%     { transform: translateY(0) scaleY(0.92) scaleX(1.06); }
      55%     { transform: translateY(-8px) scaleY(1.02) scaleX(0.99); }
      70%     { transform: translateY(0) scaleY(0.98) scaleX(1.01); }
    }

    /* Frente: idle breathe */
    #fase-pochoclo-frente { transform-origin: 90px 180px; }
    .anim-frente #fase-pochoclo-frente {
      animation: breathe 2s ease-in-out infinite alternate;
    }
    @keyframes breathe {
      from { transform: scaleY(1) scaleX(1); }
      to   { transform: scaleY(1.03) scaleX(0.985); }
    }

    /* Al Ataque: run cycle */
    #fase-al-ataque { transform-origin: 90px 180px; }
    .anim-al-ataque #fase-al-ataque {
      animation: runCycle 0.6s ease-in-out infinite alternate;
    }
    @keyframes runCycle {
      from { transform: translateX(-5px) rotate(-4deg); }
      to   { transform: translateX(5px)  rotate(4deg); }
    }

    /* === SEQUENCE mode: all six in a row === */
    .grid-stage {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
      padding: 24px 16px;
      max-width: 900px;
      margin: 0 auto;
    }
    .grid-cell {
      background: var(--card);
      border: 2.5px solid var(--border);
      border-radius: 12px;
      padding: 8px 4px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .grid-cell:hover {
      box-shadow: 0 4px 18px rgba(26,13,0,0.18);
      transform: translateY(-3px);
    }
    .grid-cell svg { width: 100%; height: auto; }
    .grid-cell span {
      font-size: 0.65rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .info-bar {
      text-align: center;
      padding: 8px 16px 0;
      font-size: 0.75rem;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-weight: 400;
    }

    footer {
      margin-top: 40px;
      padding: 16px;
      text-align: center;
      border-top: 2px solid var(--border);
      font-size: 0.72rem;
      color: var(--muted);
      font-family: Arial, sans-serif;
      font-weight: 400;
    }
  </style>
</head>
<body>

<header>
  <h1>Proyecto de Animación SVG<br><span style="color:var(--accent2)">Personaje Pochoclo</span></h1>
  <p>Documentación Técnica y Recursos SVG · Estilo Retro Rubber Hose</p>
</header>

<nav class="phase-nav" id="phaseNav">
  <button data-phase="fastidio" class="active">Fastidio</button>
  <button data-phase="presion">Presión</button>
  <button data-phase="pop">¡¡POP!!</button>
  <button data-phase="sorpresa">Sorpresa</button>
  <button data-phase="frente">Frente</button>
  <button data-phase="al-ataque">¡Al Ataque!</button>
  <button data-phase="sequence">Todos</button>
</nav>

<div id="mainStage">
  <!-- Single character stage -->
  <div class="stage" id="singleStage">
    <div class="character-wrap" id="characterWrap">
      <!-- SVG injected by JS -->
    </div>
  </div>
  <p class="info-bar" id="infoBar">Clic en los botones para cambiar la pose</p>

  <!-- Grid of all six -->
  <div class="grid-stage" id="gridStage" style="display:none"></div>
</div>

<footer>
  Paleta: #FCA311 · #E76F51 · #FFF7D6 · #FFFFFF · #822623 · #1A0D00 &nbsp;|&nbsp; SVG modular, listo para CSS / GSAP / SMIL

const PHASE_KEYS = ['fastidio', 'presion', 'pop', 'sorpresa', 'frente', 'al-ataque'];

function buildSVG(key, includeLabel = true) {
  const p = PHASES[key];
  const body = includeLabel ? p.body : p.body.replace(/<text[^>]*>.*?<\/text>/s, '');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${p.viewBox}" width="100%" height="100%">${DEFS}${body}</svg>`;
}

// ── STATE ───────────────────────────────────────────────────────────────────
let current = 'fastidio';

const wrap   = document.getElementById('characterWrap');
const info   = document.getElementById('infoBar');
const single = document.getElementById('singleStage');
const grid   = document.getElementById('gridStage');
const nav    = document.getElementById('phaseNav');

function setPhase(key) {
  if (key === 'sequence') {
    single.style.display = 'none';
    grid.style.display   = 'grid';
    info.textContent = 'Clic en cada personaje para verlo en tamaño completo';
    document.body.className = '';
    return;
  }
  single.style.display = 'flex';
  grid.style.display   = 'none';
  current = key;
  wrap.innerHTML = buildSVG(key);
  document.body.className = `anim-${key}`;
  info.textContent = `Pose: ${PHASES[key].label}`;
}

// Build grid
PHASE_KEYS.forEach(key => {
  const cell = document.createElement('div');
  cell.className = 'grid-cell';
  cell.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${PHASES[key].viewBox}">${DEFS}${PHASES[key].body}</svg><span>${PHASES[key].label}</span>`;
  cell.addEventListener('click', () => {
    nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    nav.querySelector(`[data-phase="${key}"]`).classList.add('active');
    setPhase(key);
  });
  grid.appendChild(cell);
});

// Nav buttons
nav.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    nav.querySelectorAll('button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    setPhase(btn.dataset.phase);
  });
});

// Init
setPhase('fastidio');
